<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc">
  <title id="title">Source validation AUC versus held-out MaCySTe ensemble AUC</title>
  <desc id="desc">Grouped bars show a large decrease from OpenPLC source validation to MaCySTe target event AUC for four feature schemas.</desc>
  <rect width="1000" height="590" fill="#f8fafc"/>
  <text x="55" y="48" font-family="Inter,Segoe UI,sans-serif" font-size="27" font-weight="700" fill="#0f172a">Strong in the source lab, below random in the target lab</text>
  <text x="55" y="78" font-family="Inter,Segoe UI,sans-serif" font-size="15" fill="#475569">OpenPLC validation: 20-seed median · MaCySTe: 20-model ensemble event AUC</text>
  <line x1="90" y1="500" x2="950" y2="500" stroke="#64748b" stroke-width="1.5"/>
  <line x1="90" y1="110" x2="90" y2="500" stroke="#64748b" stroke-width="1.5"/>
  <g font-family="Inter,Segoe UI,sans-serif" font-size="13" fill="#475569" text-anchor="end">
    <text x="80" y="505">0.0</text><text x="80" y="427">0.2</text><text x="80" y="349">0.4</text><text x="80" y="271">0.6</text><text x="80" y="193">0.8</text><text x="80" y="115">1.0</text>
  </g>
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="90" y1="422" x2="950" y2="422"/><line x1="90" y1="344" x2="950" y2="344"/><line x1="90" y1="266" x2="950" y2="266"/><line x1="90" y1="188" x2="950" y2="188"/><line x1="90" y1="110" x2="950" y2="110"/>
  </g>
  <line x1="90" y1="305" x2="950" y2="305" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="945" y="298" font-family="Inter,Segoe UI,sans-serif" font-size="13" fill="#b91c1c" text-anchor="end">random ranking = 0.5</text>
  <g>
    <rect x="150" y="218" width="52" height="282" rx="4" fill="#0f766e"/><rect x="208" y="374" width="52" height="126" rx="4" fill="#f97316"/>
    <rect x="355" y="147" width="52" height="353" rx="4" fill="#0f766e"/><rect x="413" y="376" width="52" height="124" rx="4" fill="#f97316"/>
    <rect x="560" y="135" width="52" height="365" rx="4" fill="#0f766e"/><rect x="618" y="372" width="52" height="128" rx="4" fill="#f97316"/>
    <rect x="765" y="122" width="52" height="378" rx="4" fill="#0f766e"/><rect x="823" y="344" width="52" height="156" rx="4" fill="#f97316"/>
  </g>
  <g font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    <text x="176" y="209" fill="#115e59">0.723</text><text x="234" y="365" fill="#c2410c">0.322</text>
    <text x="381" y="138" fill="#115e59">0.904</text><text x="439" y="367" fill="#c2410c">0.318</text>
    <text x="586" y="126" fill="#115e59">0.936</text><text x="644" y="363" fill="#c2410c">0.329</text>
    <text x="791" y="113" fill="#115e59">0.968</text><text x="849" y="335" fill="#c2410c">0.400</text>
  </g>
  <g font-family="Inter,Segoe UI,sans-serif" font-size="14" fill="#0f172a" text-anchor="middle">
    <text x="205" y="530">flow</text><text x="410" y="530">protocol</text><text x="615" y="530">physical_strict</text><text x="820" y="530">physical_proxy</text>
  </g>
  <rect x="320" y="555" width="15" height="15" rx="2" fill="#0f766e"/><text x="343" y="568" font-family="Inter,Segoe UI,sans-serif" font-size="14" fill="#334155">OpenPLC source validation</text>
  <rect x="565" y="555" width="15" height="15" rx="2" fill="#f97316"/><text x="588" y="568" font-family="Inter,Segoe UI,sans-serif" font-size="14" fill="#334155">held-out MaCySTe event AUC</text>
</svg>

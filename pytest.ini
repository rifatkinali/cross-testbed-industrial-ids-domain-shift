[pytest]
# Maritime-Lab pytest configuration
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for organizing tests
markers =
    unit: Unit tests (fast, no dependencies)
    integration: Integration tests (require services/data)
    slow: Slow tests (data loading, model training)
    
# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Minimum Python version
minversion = 3.8
